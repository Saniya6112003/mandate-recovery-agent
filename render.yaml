# Render blueprint — deploys the audit console and webhook receiver.
#
# Deploy:
#   1. Push this repo to GitHub
#   2. render.com -> New -> Blueprint -> pick the repo
#   3. Fill the secrets marked sync:false in the Render dashboard
#   4. Point the Razorpay webhook at  https://<service>.onrender.com/webhook
#
# The free instance sleeps after inactivity and takes ~30s to wake. Razorpay
# retries failed webhook deliveries, so a sleeping instance delays a
# confirmation rather than losing it — but hit the URL once before a live
# demo so the first request isn't the cold start.
services:
  - type: web
    name: mandate-recovery-agent
    runtime: python
    plan: free
    # Region is deliberately left unset. Render cannot move an existing
    # service between regions in place — setting it on a live blueprint can
    # force a recreate, which changes the URL and drops the audit log. Pick
    # the region at first deploy if it matters; do not change it afterwards.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # Durable audit log. Without this the log falls back to a JSONL file on
      # the container filesystem, which does NOT survive a redeploy — a
      # verified recovery was lost that way before this was added.
      - key: DATABASE_URL
        fromDatabase:
          name: mandate-recovery-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: REASONING_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: RECOVERY_KILL_SWITCH
        value: "false"
      # Set these in the Render dashboard — never commit them.
      - key: GROQ_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

databases:
  - name: mandate-recovery-db
    plan: free
    databaseName: mandate_recovery
    user: mandate_recovery
